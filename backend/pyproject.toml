[project]
name = "stock-agent"
version = "0.1.0"
description = "A multi-layered AI-driven stock trading and analysis agent system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "finance-datareader>=0.9.50",
    "backtrader>=1.9.78.120",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "openai>=1.13.3",
    "anthropic>=0.18.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "nest-asyncio>=1.6.0",
    "pytz>=2026.2",
    "ccxt>=4.5.56",
    "clickhouse-connect[async]>=1.1.1",
    "duckdb>=1.5.3",
    "pymongo>=4.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=0.23.5",
    "ipykernel>=6.29.3"
]
